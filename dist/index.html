<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Reports Dashboard</title>
    <script type="module" crossorigin src="/assets/index-D1Yp6rZT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CplGE95Y.css">
  </head>
  <body>
    <header class="dashboard-header">
      <div class="header-left">
        <h1>Weekly Dashboard</h1>
        <p>Аналітика та звіти по агентствам</p>
      </div>
      <div class="header-right">
        <button id="refresh-btn" class="btn btn-primary">Оновити дані</button>
      </div>
    </header>

    <div class="tabs-container">
      <button class="tab-btn active" data-tab="tab-main">Загальний Дашборд</button>
      <button class="tab-btn" data-tab="tab-cost">Cost (Агенства)</button>
      <button class="tab-btn" data-tab="tab-revenue">Revenue (Партнери)</button>
      <button class="tab-btn" data-tab="tab-validation">Перевірка</button>
    </div>

    <!-- MAIN TAB -->
    <div id="tab-main" class="tab-content active">
      <section class="dashboard-section filters-section">
        <div class="filters-grid">
          <div class="filter-group">
            <label for="main-period-date">Виберіть кінцеву дату (покаже 5 тижнів):</label>
            <select id="main-period-date">
              <!-- Dates will be populated here -->
            </select>
          </div>
        </div>
      </section>

      <section class="dashboard-section">
        <h2>Візуалізація трендів</h2>
        <div class="charts-grid">
          <div class="chart-card">
            <canvas id="chart1"></canvas>
          </div>
          <div class="chart-card">
            <canvas id="chart2"></canvas>
          </div>
        </div>
      </section>

      <section class="dashboard-section">
        <h2>Зведена таблиця даних</h2>
        <div class="table-responsive">
          <table id="main-table">
            <thead>
              <tr id="main-table-header">
                <th>МЕТРИКА</th>
                <!-- Dates will be populated here -->
              </tr>
            </thead>
            <tbody id="main-table-body">
              <!-- Rows will be populated here -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- COST TAB -->
    <div id="tab-cost" class="tab-content">
      <section class="dashboard-section filters-section">
        <div class="filters-grid">
          <div class="filter-group">
            <label for="cost-period">Період:</label>
            <select id="cost-period">
              <option value="4w">Останні 4 тижні</option>
              <option value="8w">Останні 8 тижнів</option>
              <option value="all">Весь час</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Відображати блоки:</label>
            <div class="checkbox-group">
              <label><input type="checkbox" id="cb-popolneniya" checked> Пополнения агенств</label>
              <label><input type="checkbox" id="cb-itogo" checked> Итого на агенствах</label>
              <label><input type="checkbox" id="cb-unallocated" checked> У Агенств не распределенный</label>
              <label><input type="checkbox" id="cb-balance" checked> Баланс на акках агенства</label>
              <label><input type="checkbox" id="cb-spend" checked> Спенд по агенствам</label>
            </div>
          </div>
        </div>
      </section>

      <section class="dashboard-section">
        <div class="table-responsive">
          <table id="cost-table">
            <thead>
              <tr id="cost-table-header">
                <th>АГЕНСТВО</th>
                <!-- Dates will be populated here -->
              </tr>
            </thead>
            <tbody id="cost-table-body">
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- REVENUE TAB -->
    <div id="tab-revenue" class="tab-content">
      <section class="dashboard-section filters-section">
        <div class="filters-grid">
          <div class="filter-group">
            <label for="rev-period">Період:</label>
            <select id="rev-period">
              <option value="4w">Останні 4 тижні</option>
              <option value="8w">Останні 8 тижнів</option>
              <option value="all">Весь час</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="rev-partner">Партнер:</label>
            <select id="rev-partner">
              <option value="all">Всі партнери</option>
              <!-- Partners will be populated here -->
            </select>
          </div>
          <div class="filter-group">
            <label for="rev-sort">Сортування:</label>
            <select id="rev-sort">
              <option value="default">За замовчуванням</option>
              <option value="revenue-desc">За ревеню (останній тиждень) ▼</option>
            </select>
          </div>
        </div>
      </section>

      <section class="dashboard-section">
        <div class="table-responsive">
          <table id="revenue-table">
            <thead>
              <tr id="revenue-table-header">
                <th>ПАРТНЕР</th>
                <!-- Dates will be populated here -->
              </tr>
            </thead>
            <tbody id="revenue-table-body">
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- VALIDATION TAB -->
    <div id="tab-validation" class="tab-content">
      <section class="dashboard-section validation-warnings">
        <h2>Попередження щодо незаповнених даних</h2>
        <div id="validation-messages-list" class="warnings-list">
          <!-- Warnings will be populated here -->
        </div>
      </section>

      <section class="dashboard-section">
        <h2>Перевірка блоку "Проверка"</h2>
        <div class="table-responsive">
          <table id="validation-table">
            <thead>
              <tr id="validation-table-header">
                <th>МЕТРИКА</th>
                <!-- Dates will be populated here -->
              </tr>
            </thead>
            <tbody id="validation-table-body">
              <!-- Verification rows will be populated here -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

  </body>
</html>
